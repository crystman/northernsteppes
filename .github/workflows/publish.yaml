# Simple workflow for deploying static content to GitHub Pages
name: Deploy Zola to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Publish site
    runs-on: ubuntu-latest
    steps:
    - name: Checkout main
      uses: actions/checkout@v3
    - name: Setup Pages
      uses: actions/configure-pages@v3
    # Pinned to v0.22.1: the action's tags mirror the bundled Zola version.
    # Zola 0.23 is a breaking release (Tera v2; macros, imports and shortcodes
    # removed) that this site's templates cannot build. Do not move this to
    # @master or a 0.23.x tag until the templates are migrated.
    - name: Build and deploy
      uses: shalzz/zola-deploy-action@v0.22.1
      env:
        BUILD_ONLY: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
