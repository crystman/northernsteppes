name: Bot tests

# Runs the bot's unit tests plus the parity check that asserts the Python rank
# rules still agree with the Tera macros in templates/ranks.html. Triggered by
# changes to any of the three things that can break that agreement: the bot
# code, the templates, or the member data itself.
on:
  push:
    branches: ["main"]
    paths:
      - "bot/**"
      - "templates/**"
      - "content/members/**"
      - ".github/workflows/bot-tests.yaml"
  pull_request:
    paths:
      - "bot/**"
      - "templates/**"
      - "content/members/**"
      - ".github/workflows/bot-tests.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r bot/requirements-dev.txt

      # The parity test builds the real site, so it needs the same Zola the
      # deploy uses. Read the version out of publish.yaml rather than pinning
      # it twice -- the deploy action's tags mirror the bundled Zola version.
      - name: Install pinned Zola
        run: |
          set -euo pipefail
          version=$(grep -oP 'zola-deploy-action@v\K\d+\.\d+\.\d+' \
            .github/workflows/publish.yaml)
          echo "Installing zola $version (pinned by publish.yaml)"
          curl -sSfL -o zola.tar.gz \
            "https://github.com/getzola/zola/releases/download/v${version}/zola-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf zola.tar.gz
          mkdir -p "$HOME/.local/bin"          # on PATH, but not always present
          install -m755 zola "$HOME/.local/bin/zola"
          zola --version

      # --require-zola turns the "zola missing" skip into a failure, so the
      # parity check can never pass vacuously in CI.
      - name: Run tests
        working-directory: bot
        run: pytest -v --require-zola
