name: Bot tests

# Runs the bot's tests. Member records live only in the database now, so there
# is no member data in the repository to trigger on, and no rendered-rank
# parity check to run -- the bot is the only thing that computes a rank.
#
# content/proficiencies/ is here because test_proficiency_links.py reads it:
# the member page links each style, profession and class to its section by
# slugifying the name, so renaming a heading there breaks a link with nothing
# in bot/ having changed.
on:
  push:
    branches: ["main"]
    paths:
      - "bot/**"
      - "content/proficiencies/**"
      - ".github/workflows/bot-tests.yaml"
  pull_request:
    paths:
      - "bot/**"
      - "content/proficiencies/**"
      - ".github/workflows/bot-tests.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    # The store's behaviour lives largely in SQL -- the ON CONFLICT that makes
    # /dues idempotent, the composite foreign key behind an unknown style -- so
    # those tests run against a real Postgres rather than a fake. Throwaway
    # credentials for a throwaway container; nothing here is a secret.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ns_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ns_bot_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r bot/requirements-dev.txt

      - name: Run tests
        working-directory: bot
        run: pytest -v
