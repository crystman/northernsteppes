# The URL the site will be built for
base_url = "https://northernsteppes.com"
title = "Northern Steppes"
description = "Northeast Indiana's Belegarth chapter, originally founded as a Dagorhir chapter in 2004."

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# [markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
# highlight_code = false

[extra]
# Base URL of the bot's read-only API. Member records live in its database and
# nowhere else, so the roster and every member page are fetched from here in
# the browser -- unset it and those pages have nothing to show. Everything
# else on the site is still built statically and does not depend on it.
#
# FORK OVERRIDE: this branch deploys to crystman.github.io and reads the test
# bot, so trying something out cannot touch real member records. Upstream
# points at production; do not carry this line there.
api_url = "https://skillful-quietude-test.up.railway.app"
full_title = "Northern Steppes - Foam Fighting in Fort Wayne, Indiana"
image = "social.webp"
google = "battle_small.webp"

# 0 == Sunday

[[extra.practices]]
location_name = "Shoaff Park by the Splash Pad"
location_coords = "41.144078,-85.097697"
day_of_the_week = 0
time_of_day = [13, 0]
length = 4

